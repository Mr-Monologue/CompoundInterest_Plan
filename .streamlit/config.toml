[theme]
# 深色主题
base = "dark"

# 主色调 - 蓝色系
primaryColor = "#1f77b4"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#262730"
textColor = "#fafafa"

# 字体
font = "sans serif"

[server]
# 服务器配置
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
# 浏览器配置
gatherUsageStats = false

[client]
# 客户端配置
showErrorDetails = true
